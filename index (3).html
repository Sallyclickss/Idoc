<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDOC Eye Care Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a clinic tool. Thin top bar for role, language and network; patient screens sit in a phone-width column, staff screens use the full width. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#16201c; --muted:#5b6862; --line:#dce2dc;
  --accent:#0d6b50; --accent-ink:#ffffff; --accent-soft:#e3f1ec;
  --warn:#9a5b00; --warn-bg:#fcf1dd; --danger:#b42318; --danger-bg:#fcebe8; --ok:#1d6f3b; --ok-bg:#e5f3e9;
  --display:"Archivo",system-ui,sans-serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201c; --ink:#e4ebe7; --muted:#97a69f; --line:#28332e;
  --accent:#43b48c; --accent-ink:#06130e; --accent-soft:#163027;
  --warn:#efb455; --warn-bg:#2b2110; --danger:#f17d70; --danger-bg:#2e1613; --ok:#6fcf91; --ok-bg:#122619; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201c; --ink:#e4ebe7; --muted:#97a69f; --line:#28332e;
  --accent:#43b48c; --accent-ink:#06130e; --accent-soft:#163027;
  --warn:#efb455; --warn-bg:#2b2110; --danger:#f17d70; --danger-bg:#2e1613; --ok:#6fcf91; --ok-bg:#122619; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:10px 20px}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.02em}
.brand span{display:block;font-size:.78rem;color:var(--muted);line-height:1.1}
.brand svg{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--warn)}
.chip.off{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.demo{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:7px 20px;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* layout */
main{padding:24px 16px 80px}
.narrow{max-width:560px;margin:0 auto;display:grid;gap:16px}
.wide{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.stack{display:grid;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;padding-left:0;color:var(--muted)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.giant{width:100%;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:34px 20px;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center}
.giant svg{margin-bottom:6px}
.giant b{font-family:var(--display);font-size:1.7rem;font-weight:800}
.giant span{opacity:.85}

/* forms */
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-weight:400}
textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--bg);font-weight:500}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.urg{border-left:4px solid var(--danger)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

/* status */
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.verdict{border-radius:12px;padding:20px;display:grid;gap:8px;border-left:6px solid}
.verdict.pass{background:var(--ok-bg);border-color:var(--ok)}
.verdict.refer{background:var(--warn-bg);border-color:var(--warn)}
.verdict.urgent{background:var(--danger-bg);border-color:var(--danger)}
.verdict h2{font-size:1.45rem}
.list{display:grid;gap:0}
.item{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-family:var(--display);font-size:2rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
ul.plain{margin:0;padding-left:20px;display:grid;gap:6px}
.thumb{width:120px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.preview{max-width:100%;border-radius:10px;border:1px solid var(--line)}

/* eye test */
.chart{background:#fff;color:#000;border-radius:12px;border:1px solid var(--line);min-height:240px;display:grid;place-items:center;padding:24px}
.chart svg{fill:#000;transition:transform .15s}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;width:100%}
.dirs .btn{padding:14px 8px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}

/* sms drawer + modal */
.drawer{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:16px;z-index:20;display:grid;gap:10px}
.reviewed{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:0}
.reviewed svg{flex:none}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:.72rem;font-weight:700;line-height:18px;text-align:center;font-family:var(--mono)}
.thread{display:grid;gap:3px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.thread .badge{justify-self:start}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bubbles{display:grid;gap:8px;max-height:42vh;overflow:auto;padding:4px 2px}
.bubble{max-width:85%;background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.bubble .mono{font-size:.7rem;color:var(--muted)}
.bubble.mine{justify-self:end;background:var(--accent-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.small-btn{padding:6px 10px;font-size:.82rem;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sms{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.88rem;display:grid;gap:2px}
.sms .mono{font-size:.75rem;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--surface);border-radius:16px;padding:24px;max-width:420px;width:100%;display:grid;gap:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:25;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){.top{padding:10px 14px} h1{font-size:1.5rem}}
</style>

function msg(from, to, text){ S.msgs.push({id:uid("m"), from:from, to:to, text:text, at:stamp(0), read:false}); }

function meParty(){ return S.role === "patient" ? (S.patientId ? "p:"+S.patientId : null) : S.role === "doctor" ? "d:"+S.docProv : "f"; }
function partyName(x){
  if(x === "s") return "IDOC system";
  if(x === "f") return S.role === "patient" ? "IDOC · Halima (facilitator)" : "Halima Yusuf · Facilitator";
  var id = x.slice(2);
  if(x.indexOf("p:") === 0){ var pt = P(id); return pt ? pt.name : "Patient"; }
  if(x.indexOf("d:") === 0){ var v = PV(id); return (S.role === "patient" ? "IDOC · " : "")+(v ? v.doctor : "Doctor"); }
  return x;
}

function unreadFor(x){ return x ? S.msgs.filter(function(m){ return m.to === x && !m.read; }).length : 0; }
function threadsFor(x){
  var map = {};
  S.msgs.forEach(function(m){ if(m.to !== x && m.from !== x) return; var o = m.to === x ? m.from : m.to; (map[o] = map[o] || []).push(m); });
  return Object.keys(map).map(function(o){ var l = map[o].sort(function(a,b){ return a.at < b.at ? -1 : 1; }); return {other:o, msgs:l, last:l[l.length-1], unread:l.filter(function(m){ return m.to === x && !m.read; }).length}; })
    .sort(function(a,b){ return a.last.at < b.last.at ? 1 : -1; });
}

var URGENT = ["s_sudden","s_pain","s_injury","s_chem"];
var REFER = ["s_far","s_near","s_cloudy","s_red","s_discharge","s_night","s_glasses","s_diab"];
var DIRS = ["up","right","down","left"];
var SLOTS = ["09:00","10:30","12:00","14:00","15:30"];
function acuityLabel(i){ return i < 0 ? t("worse") : LEVELS[i].l; }
function outcomeOf(sym, ac){
  if(sym.some(function(s){ return URGENT.indexOf(s) > -1; })) return "urgent";
  if(ac.right < 4 || ac.left < 4) return "refer";            /* worse than 6/12 in either eye */
  if(Math.abs(ac.right - ac.left) >= 2) return "refer";      /* two or more lines difference */
  if(sym.some(function(s){ return REFER.indexOf(s) > -1; })) return "refer";
  return "pass";
}

function addDays(iso, n){ var d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString(); }
/* reminders: day-before appointment, and one year after the last check */
function dueReminders(){
  var out = [], tomorrow = day(1), yearAgo = addDays(stamp(0), -365);
  S.appts.forEach(function(a){
    if(a.synced && (a.status === "confirmed" || a.status === "requested") && a.date === tomorrow && !S.remSent["appt:"+a.id])
      out.push({key:"appt:"+a.id, pid:a.pid, kind:"Appointment tomorrow", detail:PV(a.prov).doctor+" · "+a.time+" · "+(a.mode==="video"?"video":"phone")});
  });
  S.patients.forEach(function(p){
    var last = screensOf(p.id)[0];
    if(last && last.at <= yearAgo && !S.remSent["check:"+last.id])
      out.push({key:"check:"+last.id, pid:p.id, kind:"Yearly re-check", detail:"Last check "+fmtD(last.at)});
  });
  return out;
}
function upcomingRechecks(){
  return S.patients.map(function(p){ var l = screensOf(p.id)[0]; return l ? {p:p, due:addDays(l.at,365)} : null; })
    .filter(function(x){ return x && x.due > stamp(0); }).sort(function(a,b){ return a.due < b.due ? -1 : 1; }).slice(0,3);
}
function sendDue(){
  var list = dueReminders();
  list.forEach(function(r){
    var pt = P(r.pid);
    if(r.key.indexOf("appt:") === 0){
      var a = S.appts.filter(function(x){ return "appt:"+x.id === r.key; })[0], L = plang(pt.id);
      smsTo(pt.id, "rem_appt", {m:sw(L, a.mode, {}), d:PV(a.prov).doctor, date:fmtD(a.date), time:a.time});
    } else smsTo(pt.id, "rem_check", {n:pt.name.split(" ")[0], s:S.station});
    S.remSent[r.key] = stamp(0);
  });
  return list.length;
}

/* ---------- screening flow ---------- */
function startFlow(pid){
  S.flow = {role:S.role, pid:pid, step:"consent", sym:[], eye:"right", lvl:0, trial:0, ok:0, dir:rand(), best:-1, ac:{}, photo:null};
}
function rand(prev){ var d; do{ d = DIRS[Math.floor(Math.random()*4)]; }while(d === prev); return d; }
var STEPS = ["consent","symptoms","prep","acuity","photo"];
function flowView(){
  var f = S.flow, idx = STEPS.indexOf(f.step), who = P(f.pid);
  var h = '<div class="row between"><button class="btn ghost" data-a="cancelFlow">← '+esc(t("back"))+'</button><span class="muted small">'+esc(t("step",{a:idx+1,b:STEPS.length}))+'</span></div>'+
    '<div class="progress" aria-hidden="true">'+STEPS.map(function(s,i){ return '<i class="'+(i<=idx?"on":"")+'"></i>'; }).join("")+'</div>';
  if(S.role === "facilitator") h += '<div class="notice">Assisted check for <b>'+esc(who.name)+'</b>, '+esc(who.age)+'</div>';
  if(f.step === "consent"){
    h += '<div class="card"><h2>'+esc(t("consent_t"))+'</h2><ul class="plain">'+["c1","c2","c3","c4"].map(function(k){ return '<li>'+esc(t(k))+'</li>'; }).join("")+'</ul><button class="btn primary full" data-a="flowNext" data-v="symptoms">'+esc(t("agree"))+'</button></div>';
  } else if(f.step === "symptoms"){
    var box = function(k, urg){ return '<label class="check'+(urg?" urg":"")+'" for="sym-'+k+'"><input id="sym-'+k+'" type="checkbox" name="sym" value="'+k+'"'+(f.sym.indexOf(k)>-1?" checked":"")+'><span>'+esc(t(k))+'</span></label>'; };
    h += '<form class="card" data-form="symptoms"><h2>'+esc(t("sym_t"))+'</h2><p class="muted">'+esc(t("sym_sub"))+'</p>'+
      '<h3 style="color:var(--danger)">'+esc(t("g_urg"))+'</h3><div class="stack">'+URGENT.map(function(k){ return box(k,true); }).join("")+'</div>'+
      '<h3>'+esc(t("g_oth"))+'</h3><div class="stack">'+REFER.map(function(k){ return box(k,false); }).join("")+'</div>'+
      '<button class="btn primary full" type="submit">'+esc(t("cont"))+'</button></form>';
  } else if(f.step === "prep"){
    h += '<div class="card"><h2>'+esc(t("prep_t"))+'</h2><ul class="plain"><li>'+esc(t("p1"))+'</li><li>'+esc(t("p2"))+'</li><li>'+esc(t("p3"))+'</li></ul><p class="notice warn small">'+esc(t("p_demo"))+'</p><button class="btn primary full" data-a="flowNext" data-v="acuity">'+esc(t("ready"))+'</button></div>';
  } else if(f.step === "acuity"){
    var L = LEVELS[f.lvl];
    h += '<div class="card"><div class="row between"><h2>'+esc(f.eye==="right"?t("r_eye"):t("l_eye"))+'</h2><span class="mono muted">'+esc(t("line",{l:L.l}))+' · '+(f.trial+1)+'/3</span></div>'+
      '<p><b>'+esc(f.eye==="right"?t("eye_r"):t("eye_l"))+'</b></p>'+
      '<div class="chart">'+eSvg(f.dir, L.px)+'</div><p class="muted" style="text-align:center">'+esc(t("which"))+'</p>'+
      '<div class="dirs"><span></span><button class="btn" data-a="ans" data-v="up">↑ '+esc(t("up"))+'</button><span></span>'+
      '<button class="btn" data-a="ans" data-v="left">← '+esc(t("left"))+'</button><button class="btn" data-a="ans" data-v="none">'+esc(t("cant"))+'</button><button class="btn" data-a="ans" data-v="right">'+esc(t("right"))+' →</button>'+
      '<span></span><button class="btn" data-a="ans" data-v="down">↓ '+esc(t("down"))+'</button><span></span></div></div>';
  } else if(f.step === "photo"){
    h += '<div class="card"><h2>'+esc(t("photo_t"))+'</h2><p>'+esc(t("photo_b"))+'</p>'+
      (f.photo ? '<img class="preview" src="'+f.photo+'" alt="Eye photo preview">' : '')+
      '<label class="btn" for="eye-photo">'+esc(t("photo_btn"))+'</label><input id="eye-photo" type="file" accept="image/*" capture="environment" hidden>'+
      '<button class="btn primary full" data-a="finish">'+esc(t("save"))+'</button>'+(f.photo?'':'<button class="btn ghost" data-a="finish">'+esc(t("photo_skip"))+'</button>')+'</div>';
  }
  return h;
}
function answer(v){
  var f = S.flow;
  f.trial++; if(v === f.dir) f.ok++;
  var fails = f.trial - f.ok, done = false, passed = false;
  if(f.ok >= 2){ done = true; passed = true; } else if(fails >= 2){ done = true; }
  if(done){
    if(passed) f.best = f.lvl;
    if(passed && f.lvl < LEVELS.length-1){ f.lvl++; f.trial = 0; f.ok = 0; }
    else {
      f.ac[f.eye] = f.best;
      if(f.eye === "right"){ f.eye = "left"; f.lvl = 0; f.trial = 0; f.ok = 0; f.best = -1; }
      else { f.step = "photo"; }
    }
  }
  f.dir = rand(f.dir);
}
function finishFlow(){
  var f = S.flow, pt = P(f.pid);
  var s = {id:uid("s"), pid:f.pid, at:stamp(0), assisted:f.role==="facilitator", sym:f.sym.slice(), ac:{right:f.ac.right, left:f.ac.left}, photo:f.photo, outcome:outcomeOf(f.sym, f.ac), synced:S.online};
  S.screenings.push(s);
  if(S.online) afterScreen(s);
  S.flow = null;
  go("result", s.id);
  if(!S.online) toast(t("saved_off"));
}
function afterScreen(s){
  var pt = P(s.pid);
  msg("f", "p:"+s.pid, smsResult(s));
  if(s.outcome !== "pass") staff("f", (s.outcome === "urgent" ? "URGENT: " : "New referral: ")+pt.name+" ("+pt.phone+") "+(s.outcome === "urgent" ? "reported a warning sign and was told to go to hospital today. Please call them." : "needs an eye doctor. Right "+LEVELSL(s.ac.right)+", left "+LEVELSL(s.ac.left)+"."));
}
function afterBook(a, byFac){
  var pt = P(a.pid), pv = PV(a.prov);
  smsTo(a.pid, "req", {d:pv.doctor, date:fmtD(a.date), time:a.time});
  staff("d:"+a.prov, "New request: "+pt.name+", "+pt.age+", speaks "+LN[pt.lang||"en"]+". "+(a.mode==="video"?"Video call":"Phone call")+" on "+fmtD(a.date)+" at "+a.time+"."+(a.note?" Note: "+a.note:"")+(byFac?" Booked by the facilitator.":""));
  if(!byFac) staff("f", pt.name+" booked "+pv.doctor+" for "+fmtD(a.date)+" at "+a.time+".");
}
function smsResult(s){
  var L = plang(s.pid), a = function(i){ return i < 0 ? "<6/60" : LEVELS[i].l; };
  return sw(L, "saved", {r:a(s.ac.right), l:a(s.ac.left), x:sw(L, s.outcome, {})});
}

function followups(){
  var out = [];
  S.patients.forEach(function(p){
    var s = screensOf(p.id)[0]; if(!s || s.outcome === "pass") return;
    var ap = apptsOf(p.id).filter(function(a){ return a.created >= s.at || a.sid === s.id; })[0];
    var state = !ap ? "none" : ap.status;
    if(state === "none" || state === "missed") out.push({p:p, s:s, a:ap, state:state});
  });
  return out;
}
function facStats(){
  var latest = S.patients.map(function(p){ return screensOf(p.id)[0]; }).filter(Boolean);
  var need = latest.filter(function(s){ return s.outcome !== "pass"; });
  var booked = need.filter(function(s){ return apptsOf(s.pid).some(function(a){ return a.status !== "missed"; }); });
  var seen = need.filter(function(s){ return apptsOf(s.pid).some(function(a){ return a.status === "done"; }); });

/* ---------- actions ---------- */
function act(a, d){
  switch(a){
    case "role": S.role = d.v; S.flow = null; S.inbox.thread = null; window.scrollTo(0,0); break;
    case "lang": S.lang = d.v; break;
    case "net":
      S.online = !S.online;
      if(S.online){
        var n = 0;
        S.screenings.forEach(function(s){ if(!s.synced){ s.synced = true; n++; afterScreen(s); } });
        S.appts.forEach(function(x){ if(!x.synced){ x.synced = true; n++; afterBook(x, x.byFac); } });
        toast(n ? n+" saved item"+(n===1?"":"s")+" uploaded" : "Back online");
      } else toast("Offline. New checks will be saved on this device.");
      break;
    case "inbox": S.inbox.open = !S.inbox.open; S.inbox.thread = null; break;
    case "thread": S.inbox.thread = d.v || null; break;
    case "quick": sendReply(d.v); break;
    case "reset": S = seed(); toastMsg = null; break;
    case "authTab": S.param.patient = d.v; break;
    case "asPatient": S.patientId = d.id; S.lang = P(d.id).lang || S.lang; go("home"); break;
    case "signout": S.patientId = null; go("home"); break;
    case "go": go(d.v, d.p); if(d.v === "care") S.careTab = "all"; if(d.v === "book") S.bookProv = ""; window.scrollTo(0,0); break;
    case "readAll": S.notifs.forEach(function(n){ if(n.pid === S.patientId) n.read = true; }); break;
    case "startCheck": startFlow(S.patientId); window.scrollTo(0,0); break;
    case "cancelFlow":
      var f = S.flow, i = STEPS.indexOf(f.step);
      if(i <= 0) S.flow = null; else if(f.step === "acuity") { f.step = "prep"; f.eye = "right"; f.lvl = 0; f.trial = 0; f.ok = 0; f.best = -1; f.ac = {}; } else f.step = STEPS[i-1];
      break;
    case "flowNext": S.flow.step = d.v; window.scrollTo(0,0); break;
    case "ans": answer(d.v); break;
    case "finish": finishFlow(); window.scrollTo(0,0); break;
    case "careTab": S.careTab = d.v; break;
    case "bookWith": S.bookProv = d.id; S.view[S.role] = "book"; S.param[S.role] = d.s || (screensOf(ctxPid())[0]||{}).id || null; window.scrollTo(0,0); break;
    case "closeModal": S.modal = null; go(home()); break;
    case "facPick": S.facPatientId = d.id; S.lang = P(d.id).lang || S.lang; startFlow(d.id); window.scrollTo(0,0); break;
    case "facOpen": S.facPatientId = d.id; go("result", d.s); window.scrollTo(0,0); break;
    case "facBook": S.facPatientId = d.id; S.bookProv = ""; go("book", d.s); window.scrollTo(0,0); break;
    case "remind":
      var pt = P(d.id); smsTo(pt.id, "remind", {n:pt.name.split(" ")[0], s:S.station});
      S.contacted[d.id] = stamp(0); toast("Reminder sent to "+pt.name+"'s messages"); break;
    case "sendDue": var nd = sendDue(); toast(nd+" reminder"+(nd===1?"":"s")+" sent"); break;
    case "contacted": S.contacted[d.id] = stamp(0); toast("Marked as called"); break;
    case "docOpen": S.param.doctor = d.id || null; break;
    case "docConfirm":
      var ap = S.appts.filter(function(x){ return x.id === d.id; })[0], pv = PV(ap.prov), p2 = P(ap.pid);
      ap.status = "confirmed";
      var L2 = plang(p2.id), msg = sw(L2, "conf", {d:pv.doctor, m:W[L2][ap.mode].toLowerCase(), date:fmtD(ap.date), time:ap.time});
      notify(p2.id, msg); smsTo(p2.id, "ready", {d:pv.doctor, date:fmtD(ap.date), time:ap.time}, "d:"+pv.id);
      staff("f", pv.doctor+" confirmed "+p2.name+" for "+fmtD(ap.date)+" at "+ap.time+".");
      toast("Confirmed. Patient and facilitator notified."); break;
    case "docMissed":
      var am = S.appts.filter(function(x){ return x.id === d.id; })[0], pm = P(am.pid), vm = PV(am.prov); am.status = "missed"; S.param.doctor = null;
      smsTo(pm.id, "missed", {d:vm.doctor}, "d:"+vm.id);
      staff("f", pm.name+" missed the "+(am.mode==="video"?"video":"phone")+" call with "+vm.doctor+" on "+fmtD(am.date)+". Please follow up.");
      toast("Marked as missed. Patient and facilitator notified."); break;
  }
  render();
}
function formAct(name, f){
  var fd = new FormData(f), o = {}; fd.forEach(function(v,k){ o[k] = v; });
  if(name === "register" || name === "facReg"){
    var p = {id:uid("p"), name:o.name.trim(), phone:o.phone.replace(/\s/g,""), gender:o.gender, age:+o.age, community:o.community.trim(), lang:o.lang || S.lang};
    S.patients.push(p);
    if(name === "register"){ S.patientId = p.id; S.lang = p.lang; go("home"); }
    else { S.facPatientId = p.id; S.lang = p.lang; startFlow(p.id); }
  } else if(name === "signin"){
    var ph = o.phone.replace(/\s/g,""), m = S.patients.filter(function(x){ return x.phone === ph; })[0];
    if(!m){ toast(t("no_acct")); } else { S.patientId = m.id; S.lang = m.lang || S.lang; go("home"); }
  } else if(name === "symptoms"){
    S.flow.sym = fd.getAll("sym"); S.flow.step = "prep"; window.scrollTo(0,0);
  } else if(name === "book"){
    if(!o.prov){ toast(t("pick_doc")); render(); return; }
    if(!o.date || !o.time){ toast(t("need_dt")); render(); return; }
    var pid = ctxPid(), pt = P(pid);
    pt.name = o.name.trim() || pt.name; if(o.gender) pt.gender = o.gender;
    var a = {id:uid("a"), pid:pid, sid:o.sid || ((screensOf(pid)[0]||{}).id || null), prov:o.prov, date:o.date, time:o.time, mode:o.mode, note:(o.note||"").trim(), status:"requested", synced:S.online, created:stamp(0)};
    S.appts.push(a);
    a.byFac = S.role === "facilitator";
    if(S.online) afterBook(a, a.byFac);
    S.modal = {t:"booked_t", b:"booked_b", b2:"rem_day"};
  } else if(name === "reply"){
    if((o.text||"").trim()) sendReply(o.text.trim());
    return;
  } else if(name === "docDone"){
    var ap = S.appts.filter(function(x){ return x.id === o.id; })[0];
    ap.status = "done"; ap.outcome = o.outcome; ap.docNote = o.note.trim();
    notify(ap.pid, PV(ap.prov).doctor+": "+ap.outcome+". "+ap.docNote);
    smsTo(ap.pid, "note", {d:PV(ap.prov).doctor, n:ap.docNote}, "d:"+ap.prov);
    staff("f", PV(ap.prov).doctor+" completed the consultation with "+P(ap.pid).name+": "+ap.outcome+".");
    S.param.doctor = null; toast("Consultation completed. Patient and facilitator notified.");
  }
  render();
}

document.addEventListener("click", function(e){
  /* forms are handled here, not by "submit": the hosting frame can block form submission */
  var sb = e.target.closest('button[type="submit"]'), sf = sb && sb.closest("form[data-form]");
  if(sf){
    e.preventDefault();
    if(sf.checkValidity && !sf.checkValidity()){ if(sf.reportValidity) sf.reportValidity(); return; }
    formAct(sf.getAttribute("data-form"), sf); return;
  }
  var b = e.target.closest("[data-a]"); if(!b) return;
  e.preventDefault(); act(b.getAttribute("data-a"), b.dataset);
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  var f = e.target.closest("form[data-form]"), btn = f && f.querySelector('button[type="submit"]');
  if(btn){ e.preventDefault(); btn.click(); }
});
document.addEventListener("submit", function(e){
  var f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault(); formAct(f.getAttribute("data-form"), f);
});
document.addEventListener("change", function(e){
  if(e.target.id === "eye-photo" && e.target.files && e.target.files[0]){
    shrink(e.target.files[0], function(url){ S.flow.photo = url; render(); });
  } else if(e.target.getAttribute("data-change") === "docSel"){
    S.docProv = e.target.value; S.param.doctor = null; render();
  }
});
function shrink(file, cb){
  var r = new FileReader();
  r.onload = function(){ var img = new Image(); img.onload = function(){
    var m = 560, s = Math.min(1, m/Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.8)); }; img.src = r.result; };
  r.readAsDataURL(file);
}
render();
})();
</script>
</body>
